<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalBingo - Play & Win</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>KalBingo</h1>
            <div id="userInfo">Balance: <span id="userBalance">0.00</span> ETB</div>
        </header>

        <main>
            <div id="gameLobby">
                <h2>Lobby Countdown: <span id="timer">40</span>s</h2>
                <div id="cardGrid"></div>
                <button id="readyBtn">I'm Ready</button>
            </div>
        </main>
    </div>

    <!-- Announcement Modal Popup -->
    <div id="announcementModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="popupImage" src="" class="hidden">
            <p id="popupMessage"></p>
        </div>
    </div>

    <script src="/js/player.js"></script>
</body>
</html>
