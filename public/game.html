<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Bingo</title><link rel="stylesheet" href="game.css"><script src="/socket.io/socket.io.js"></script></head><body>
<header><div class="head-left"><span class="live"><i></i> LIVE</span><b id="patternName">Any One Line</b><small id="playersPlaying">0 players playing</small></div><div><span id="userName"></span> · <b><span id="balance">0.00</span> Birr</b></div></header>
<main><section class="status"><div><small>LAST NUMBER</small><strong id="lastNumber">--</strong></div><div><b id="calledCount">0 / 75</b><small>numbers called</small></div><div class="toggles"><label>Auto mark <input id="autoMarkEl" type="checkbox" checked></label><label>Blink one-away <input id="blinkToggle" type="checkbox" checked></label></div></section>
<section class="game-layout"><aside class="number-board"><h3>B I N G O</h3><div id="numberBoard" class="numbers"></div></aside><section class="card-side"><h3>Your Cards</h3><div id="cardsEl" class="cards"><p>Loading cards…</p></div></section></section></main>
<div id="winnerOverlay" class="overlay"><div class="winner"><h2 id="winnerTitle">BINGO!</h2><p id="winnerText"></p><div id="winnerCard"></div><p class="returning">Returning to card selection…</p></div></div><div id="toast" class="toast"></div><script src="game.js"></script></body></html>
