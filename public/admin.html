<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .card { max-width: 600px; margin: 20px auto; background: #1e1e1e; padding: 24px; border-radius: 12px; }
        h2, h3 { color: #0088cc; margin-top: 0; }
        label { font-size: 13px; color: #aaa; margin-top: 12px; display: block; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; margin-top: 12px; }
        .post-item { background: #252525; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .post-item img { max-width: 100%; max-height: 120px; border-radius: 6px; margin-top: 8px; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-edit { background: #e6a100; }
        .btn-delete { background: #ff4d4d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📢 Send New Broadcast</h2>
        <label>Admin Secret Key</label>
        <input type="password" id="secret" placeholder="Enter ADMIN_SECRET key">

        <label>Message (HTML Supported)</label>
        <textarea id="message" rows="3" placeholder="Announcement details..."></textarea>

        <label>Upload Image File</label>
        <input type="file" id="fileInput" accept="image/*">

        <label>OR Direct Image URL</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/banner.jpg">

        <button onclick="sendAd()">Post Broadcast 🚀</button>
        <div id="status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="card">
        <h3>📋 Manage Posted Broadcasts</h3>
        <button onclick="loadAdminPosts()" style="background: #333;">Refresh Posts 🔄</button>
        <div id="postsContainer"></div>
    </div>

    <script>
        async function sendAd() {
            const adminSecret = document.getElementById('secret').value;
            const message = document.getElementById('message').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');

            if (!adminSecret) return alert("Secret key required.");

            const formData = new FormData();
            formData.append('adminSecret', adminSecret);
            formData.append('message', message);
            formData.append('imageUrl', imageUrl);
            if (fileInput.files[0]) formData.append('imageFile', fileInput.files[0]);

            status.style.color = '#0088cc';
            status.innerText = "Publishing broadcast...";

            try {
                const res = await fetch('/api/admin/broadcast', { method: 'POST', body: formData });
                const data = await res.json();
                status.style.color = data.success ? '#00d26a' : '#ff4d4d';
                status.innerText = data.message;
                if (data.success) {
                    document.getElementById('message').value = '';
                    fileInput.value = '';
                    loadAdminPosts();
                }
            } catch (err) {
                status.innerText = "Network error.";
            }
        }

        async function loadAdminPosts() {
            const adminSecret = document.getElementById('secret').value;
            const container = document.getElementById('postsContainer');
            if (!adminSecret) return container.innerHTML = `<p style="color: #888;">Enter Secret Key above to view existing posts.</p>`;

            try {
                const res = await fetch('/api/admin/notifications', {
                    headers: { 'x-admin-secret': adminSecret }
                });
                const data = await res.json();

                if (!data.success) return container.innerHTML = `<p style="color:#ff4d4d;">${data.message}</p>`;

                container.innerHTML = data.notifications.map(post => `
                    <div class="post-item">
                        <textarea id="msg_${post.id}" rows="2">${post.message}</textarea>
                        <input type="text" id="img_${post.id}" value="${post.image_url || ''}" placeholder="Image URL">
                        ${post.image_url ? `<img src="${post.image_url}">` : ''}
                        <div class="btn-group">
                            <button class="btn-edit" onclick="editPost(${post.id})">Save Edit ✏️</button>
                            <button class="btn-delete" onclick="deletePost(${post.id})">Delete 🗑️</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p style="color:#ff4d4d;">Failed to fetch posts.</p>`;
            }
        }

        async function editPost(id) {
            const adminSecret = document.getElementById('secret').value;
            const message = document.getElementById(`msg_${id}`).value;
            const imageUrl = document.getElementById(`img_${id}`).value;

            const res = await fetch(`/api/admin/notifications/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSecret, message, imageUrl })
            });
            const data = await res.json();
            alert(data.message);
            loadAdminPosts();
        }

        async function deletePost(id) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            const adminSecret = document.getElementById('secret').value;

            const res = await fetch(`/api/admin/notifications/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-secret': adminSecret }
            });
            const data = await res.json();
            alert(data.message);
            loadAdminPosts();
        }
    </script>
</body>
</html>
