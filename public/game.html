<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Bingo</title><link rel="stylesheet" href="game.css"><script src="/socket.io/socket.io.js"></script></head><body>
<header><div><span class="live"><i></i> LIVE</span><b id="patternName">Any One Line</b><small id="cardsPlaying">0 cards playing</small></div><div><span id="userName"></span> · <b><span id="balance">0.00</span> Birr</b></div></header>
<main><section class="status"><div><small>LAST NUMBER</small><strong id="lastNumber">--</strong></div><div><b id="calledCount">0 / 75</b><small>called · every <span id="interval">4</span>s</small></div><label class="auto">Auto mark <input id="autoMark" type="checkbox" checked><span></span></label></section>
<section><h3>Called Numbers</h3><div id="calledNumbers" class="called"></div></section><section id="cards" class="cards"><p>Loading cards…</p></section></main>
<div id="winnerOverlay" class="overlay"><div class="winner"><h2 id="winnerTitle">BINGO!</h2><p id="winnerText"></p><div id="winnerCard"></div><p class="returning">Returning to card selection…</p></div></div>
<div id="toast" class="toast"></div><script src="game.js"></script></body></html>
