

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notification Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .card { max-width: 600px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
        h2, h3 { color: #0088cc; margin-top: 0; }
        label { font-size: 13px; color: #aaa; margin-top: 10px; display: block; }
        input, textarea, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        select { cursor: pointer; }
        button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; margin-top: 12px; }
        .post-card { background: #252525; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .post-card img { max-width: 100%; max-height: 140px; border-radius: 6px; margin-top: 8px; object-fit: cover; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-edit { background: #e6a100; }
        .btn-delete { background: #ff4d4d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📢 Create Announcement</h2>
        <label>Admin Secret Key</label>
        <input type="password" id="secret" placeholder="Enter ADMIN_SECRET">

        <label>Target Audience / Destination</label>
        <select id="destination">
            <option value="BOTH">All (Telegram & App Notifications)</option>
            <option value="TELEGRAM_ONLY">Telegram Users Only (No Web Notification)</option>
            <option value="APP_ONLY">App Notifications Only (No Telegram)</option>
        </select>

        <label>Message Text (HTML Supported)</label>
        <textarea id="message" rows="3" placeholder="Announcement body..."></textarea>

        <label>Upload Image File</label>
        <input type="file" id="fileInput" accept="image/*">

        <label>OR Image URL</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/banner.jpg">

        <button onclick="sendBroadcast()">Publish Broadcast 🚀</button>
        <div id="status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="card">
        <h3>📋 Manage Existing Posts</h3>
        <button onclick="loadPosts()" style="background: #333;">Fetch / Refresh Posts 🔄</button>
        <div id="postsList"></div>
    </div>

    <script>
        async function sendBroadcast() {
            const adminSecret = document.getElementById('secret').value;
            const destination = document.getElementById('destination').value;
            const message = document.getElementById('message').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');

            if (!adminSecret) return alert("Please enter your Admin Secret key.");

            const formData = new FormData();
            formData.append('adminSecret', adminSecret);
            formData.append('destination', destination);
            formData.append('message', message);
            formData.append('imageUrl', imageUrl);
            if (fileInput.files[0]) formData.append('imageFile', fileInput.files[0]);

            status.style.color = '#0088cc';
            status.innerText = "Publishing post...";

            try {
                const res = await fetch('/api/admin/broadcast', { method: 'POST', body: formData });
                const data = await res.json();
                status.style.color = data.success ? '#00d26a' : '#ff4d4d';
                status.innerText = data.message;
                if (data.success) {
                    document.getElementById('message').value = '';
                    document.getElementById('imageUrl').value = '';
                    fileInput.value = '';
                    loadPosts();
                }
            } catch (err) {
                status.innerText = "Network error while broadcasting.";
            }
        }

        async function loadPosts() {
            const adminSecret = document.getElementById('secret').value;
            const list = document.getElementById('postsList');
            if (!adminSecret) return list.innerHTML = `<p style="color: #ff4d4d;">Enter Secret Key above to load posts.</p>`;

            try {
                const res = await fetch('/api/admin/notifications', {
                    headers: { 'x-admin-secret': adminSecret }
                });
                const data = await res.json();

                if (!data.success) return list.innerHTML = `<p style="color:#ff4d4d;">${data.message}</p>`;

                list.innerHTML = data.notifications.map(post => `
                    <div class="post-card">
                        <textarea id="msg_${post.id}" rows="2">${post.message}</textarea>
                        <input type="text" id="img_${post.id}" value="${post.image_url || ''}" placeholder="Image Path/URL">
                        ${post.image_url ? `<img src="${post.image_url}">` : ''}
                        <div class="btn-group">
                            <button class="btn-edit" onclick="updatePost(${post.id})">Save Changes ✏️</button>
                            <button class="btn-delete" onclick="deletePost(${post.id})">Delete Post 🗑️</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = `<p style="color:#ff4d4d;">Error loading posts.</p>`;
            }
        }

        async function updatePost(id) {
            const adminSecret = document.getElementById('secret').value;
            const message = document.getElementById(`msg_${id}`).value;
            const imageUrl = document.getElementById(`img_${id}`).value;

            const res = await fetch(`/api/admin/notifications/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSecret, message, imageUrl })
            });
            const data = await res.json();
            alert(data.message);
            loadPosts();
        }

        async function deletePost(id) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            const adminSecret = document.getElementById('secret').value;

            const res = await fetch(`/api/admin/notifications/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-secret': adminSecret }
            });
            const data = await res.json();
            alert(data.message);
            loadPosts();
        }
    </script>


    <div class="card">
        <h2>🎮 Bingo Game Settings</h2>
        <label>Winning Pattern</label>
        <select id="winningPattern">
          <option value="any_one_line">Any One Line</option><option value="any_two_lines">Any Two Lines</option><option value="any_square">Any Square (2×2)</option><option value="full">Full House</option><option value="x">X</option><option value="t">T</option><option value="reverse_t">Reverse T</option><option value="cross">Cross</option><option value="vertical_line">One Vertical Line</option><option value="horizontal_line">One Horizontal Line</option><option value="big_l">Big L</option><option value="reverse_l">Reverse L</option><option value="N">N</option><option value="H">H</option><option value="Reverse H">Reverse H</option><option value="Z">Z</option><option value="K">K</option><option value="E">E</option><option value="M">M</option><option value="Five Dots">Five Dots</option>
        </select>
        <label>Seconds between called numbers</label><input id="drawIntervalSeconds" type="number" min="1" max="60" value="4">
        <button onclick="saveGameSettings()">Save Game Settings</button>
    </div>
<script>
async function loadGameSettings(){const secret=document.getElementById('secret')?.value;if(!secret)return;const r=await fetch('/api/admin/game-settings',{headers:{'x-admin-secret':secret}});const d=await r.json();if(d.success){document.getElementById('winningPattern').value=d.winningPattern;document.getElementById('drawIntervalSeconds').value=d.drawIntervalSeconds;}}
async function saveGameSettings(){const adminSecret=document.getElementById('secret').value;const winningPattern=document.getElementById('winningPattern').value;const drawIntervalSeconds=Number(document.getElementById('drawIntervalSeconds').value);const r=await fetch('/api/admin/game-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminSecret,winningPattern,drawIntervalSeconds})});const d=await r.json();alert(d.message|| (d.success?'Game settings saved.':'Failed.'));}
</script></body>
</html>
