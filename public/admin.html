<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalBingo Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container">
        <h1>KalBingo Admin Portal</h1>

        <!-- Broadcast Section -->
        <div class="card">
            <h2>📢 Dual Broadcast (Telegram + Web Popup)</h2>
            <form id="broadcastForm">
                <textarea id="broadcastMessage" placeholder="Message content..." required></textarea>
                <input type="text" id="imageUrl" placeholder="Image URL (Optional)">
                <input type="file" id="imageFile" accept="image/*">
                <input type="password" id="adminSecret" placeholder="Admin Secret Key" required>
                <button type="submit">Deploy Broadcast</button>
            </form>
        </div>

        <!-- Balance Management -->
        <div class="card">
            <h2>💰 Adjust User Balance</h2>
            <form id="balanceForm">
                <input type="text" id="targetUsername" placeholder="Target Username" required>
                <input type="number" step="0.01" id="adjustAmount" placeholder="Amount (+/-)" required>
                <input type="text" id="adjustReason" placeholder="Reason (e.g. Deposit)" required>
                <input type="password" id="balanceAdminSecret" placeholder="Admin Secret Key" required>
                <button type="submit">Update Balance</button>
            </form>
        </div>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>
