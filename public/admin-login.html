<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kal Bingo — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --card: rgba(15, 22, 34, 0.85);
      --border: rgba(59, 130, 246, 0.25);
      --text: #e8eef6;
      --muted: #7a8ba3;
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.45);
      --gold: #f59e0b;
      --input-bg: #0c121c;
      --input-border: #243041;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59,130,246,0.22), transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(245,158,11,0.08), transparent 50%),
        radial-gradient(ellipse 40% 30% at 10% 80%, rgba(167,139,250,0.08), transparent 50%);
      pointer-events: none;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px 32px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 24px 64px rgba(0,0,0,0.5),
        0 0 80px rgba(59,130,246,0.08);
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1e3a5f, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px var(--blue-glow);
    }
    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #60a5fa, #f59e0b 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .form-group input::placeholder { color: #4a5a70; }
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
      box-shadow: 0 4px 16px rgba(37,99,235,0.35);
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.45); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      font-size: 13px;
      text-align: center;
    }
    .error.show { display: block; }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #4a5a70;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">🎱</div>
      <h1>KAL BINGO</h1>
      <p>Admin Control Panel</p>
    </div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      <div class="error" id="errorBox"></div>
    </form>
    <div class="footer">SECURE ACCESS ONLY</div>
  </div>
  <script>
    // If already logged in with valid token, go straight to dashboard
    (async function() {
      const token = localStorage.getItem('adminToken');
      if (!token) return;
      try {
        const r = await fetch('/api/admin/me', { headers: { 'x-admin-token': token } });
        const d = await r.json();
        if (d.success) {
          window.location.replace('/admin.html');
        }
      } catch (_) {}
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorBox');
      err.classList.remove('show');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();
        if (!data.success) {
          err.textContent = data.message || 'Invalid credentials';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return false;
        }
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminUser', data.username);
        localStorage.setItem('adminRole', data.role);
        window.location.replace('/admin.html');
      } catch (ex) {
        err.textContent = 'Network error. Please try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
      return false;
    }
  </script>
</body>
</html>
