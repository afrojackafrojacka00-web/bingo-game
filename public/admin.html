<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Broadcast Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .card { max-width: 500px; margin: 40px auto; background: #1e1e1e; padding: 24px; border-radius: 12px; }
        h2 { color: #0088cc; margin-top: 0; }
        label { font-size: 13px; color: #aaa; margin-top: 12px; display: block; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { background: #0088cc; font-weight: bold; cursor: pointer; border: none; margin-top: 16px; font-size: 15px; }
        button:hover { background: #0077b3; }
        #status { margin-top: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>✈️ Send Telegram Broadcast</h2>

        <label>Admin Secret Key</label>
        <input type="password" id="secret" placeholder="Enter ADMIN_SECRET">

        <label>Message Text (HTML Formatting Allowed)</label>
        <textarea id="message" rows="4" placeholder="Type your message here..."></textarea>

        <label>Upload Image (Optional)</label>
        <input type="file" id="fileInput" accept="image/*">

        <label>OR Direct Image URL (Optional)</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/banner.jpg">

        <button onclick="sendTelegramBroadcast()">Send to Telegram 🚀</button>
        <div id="status"></div>
    </div>

    <script>
        async function sendTelegramBroadcast() {
            const adminSecret = document.getElementById('secret').value;
            const message = document.getElementById('message').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');

            if (!adminSecret) return alert("Please enter your Admin Secret key.");

            const formData = new FormData();
            formData.append('adminSecret', adminSecret);
            formData.append('message', message);
            formData.append('imageUrl', imageUrl);
            if (fileInput.files[0]) formData.append('imageFile', fileInput.files[0]);

            status.style.color = '#0088cc';
            status.innerText = "Sending broadcast to Telegram...";

            try {
                const res = await fetch('/api/admin/broadcast', { method: 'POST', body: formData });
                const data = await res.json();
                status.style.color = data.success ? '#00d26a' : '#ff4d4d';
                status.innerText = data.message;
                if (data.success) {
                    document.getElementById('message').value = '';
                    fileInput.value = '';
                    document.getElementById('imageUrl').value = '';
                }
            } catch (err) {
                status.style.color = '#ff4d4d';
                status.innerText = "Network error while broadcasting.";
            }
        }
    </script>

</body>
</html>
